name: Bash Project CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Make test script executable
        run: chmod +x tests/test_project.sh
      - name: Run root test script
        run: ./tests/test_project.sh
